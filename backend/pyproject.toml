[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    { name = "Son Pham-Ba", email = "son.phamba@epfl.ch" },
]
requires-python = ">=3.11,<3.15"

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cachetools>=6.2.4",
    "fastapi>=0.128.0",
    "fastapi-cache2>=0.2.2",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
]

[tool.setuptools]
packages = [
    "api",
]

[tool.codespell]
skip = '*.json,uv.lock,tests/**,mcps/meditron/tests/**,api/models/user_profile.py'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv[cli]>=1.2.1",
    "httpx2",
]
